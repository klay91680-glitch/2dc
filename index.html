<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubai 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #fff; position: fixed; }

        .zoom-box { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; }
        .zoom-box iframe {
            position: absolute; top: 0; left: 0; width: 133.33%; height: 133.33%;
            border: none; transform: scale(0.75); transform-origin: top left;
        }

        .cover { position: fixed; bottom: 0; left: 0; width: 100%; height: 18%; background: #fff; z-index: 9999; }

        /* ညာအောက်အလယ် ခလုတ်ဒီဇိုင်း */
        .thai-icon {
            position: fixed; 
            bottom: 20%;  /* အောက်ကနေ 20% မြှင့်ထားတယ် (ကြော်ငြာအကွက်ရဲ့ အပေါ်မှာ) */
            left: 50%;    /* အလယ်ကို ရောက်အောင် */
            transform: translateX(-50%); /* အလယ်တည့်တည့်ဖြစ်အောင် ပြန်ချိန် */
            z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff; padding: 10px 20px; border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer; text-decoration: none;
            font-family: Arial, sans-serif; font-weight: bold; font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s; border: 2px solid #fff;
            animation: pulse 2s infinite;
            white-space: nowrap;
        }

        .thai-icon:hover { transform: translateX(-50%) scale(1.1); box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4); }
        .thai-icon:active { transform: translateX(-50%) scale(0.95); }
        .thai-icon span { margin-left: 5px; font-size: 12px; color: #ffeaa7; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }
    </style>
</head>
<body>
    <div class="zoom-box">
        <iframe src="https://dubai2dnew.netlify.app/" allowfullscreen scrolling="no"></iframe>
    </div>
    
    <!-- အောက်အလယ် ခလုတ် -->
    <a href="https://www.thaistock2d.com/" class="thai-icon">
        🇹🇭 Thailand 2D
    </a>

    <div class="cover"></div>
</body>
</html>
