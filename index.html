<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubai 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #fff; position: fixed; }

        /* အပေါ်ပိုင်း ခေါင်းစီးဘား (ခရမ်းပြာရောင်) */
        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background-color: #7b8cde;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 10001;
            font-family: Arial, sans-serif;
        }

        .header-bar .title {
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        .header-bar .new-badge {
            color: #00ff00;
            font-weight: bold;
            font-size: 16px;
        }

        /* ခေါင်းစီးအောက် SET နဲ့ VALUE စာသား */
        .sub-header {
            position: fixed;
            top: 45px;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 10001;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 14px;
            color: #555;
            border-bottom: 1px solid #e0e0e0;
        }

        .sub-header span {
            width: 50%;
            text-align: center;
        }

        /* အောက်ခံ iframe နေရာ */
        .zoom-box { 
            position: fixed; 
            top: 85px; 
            left: 0; 
            width: 100vw; 
            height: calc(100vh - 85px); 
            overflow: hidden; 
        }
        .zoom-box iframe {
            position: absolute; top: 0; left: 0; width: 133.33%; height: 133.33%;
            border: none; transform: scale(0.75); transform-origin: top left;
        }

        /* အပေါ်ပိုင်း ဖုံးအုပ်ရန် (အဖြူရောင်) */
        .top-overlay {
            position: fixed;
            top: 85px;
            left: 0;
            width: 100%;
            height: 12%;
            background: #ffffff;
            z-index: 9999;
        }

        /* အောက်ခံ အရောင် (အဖြူရောင်) */
        .bottom-bg {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 17%;
            background: #ffffff;
            z-index: 9999;
        }

        /* Thailand 2D ခလုတ် - ညာဘက်နဲ့ အပေါ်ကို နည်းနည်းရွှေ့ထားသည် */
        .thai-icon {
            position: fixed; 
            bottom: 10%; /* အောက်ကို ၄% ကနေ ၁၀% ကို တင်လိုက်ပါပြီ (အပေါ်ကို နည်းနည်းတက်သွားသည်) */
            left: 60%; /* ၅၀% ကနေ ၆၀% ကို တင်လိုက်ပါပြီ (ညာဘက်ကို နည်းနည်းရွှေ့သွားသည်) */
            transform: translateX(-50%) scale(0.85); /* ချုံ့ထားသည် */
            z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            background: #ffffff; /* အောက်ခံအဖြူ */
            color: #fff; 
            padding: 10px 20px; 
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.8), 0 0 30px rgba(255, 82, 82, 0.6);
            cursor: pointer; text-decoration: none;
            font-family: Arial, sans-serif; font-weight: bold; font-size: 15px;
            transition: all 0.3s ease-in-out; 
            border: 2px solid #ffd700;
            animation: pulse 1.5s infinite alternate;
            white-space: nowrap;
        }

        /* Thailand 2D စာသား - အနီရောင် */
        .thai-icon span {
            color: #d32f2f; /* အနီရောင် */
            text-shadow: 0 0 5px rgba(211, 47, 47, 0.5);
            margin-left: 8px;
            font-weight: 900;
        }

        /* နှိပ်လိုက်တဲ့အခါ (Active) - အနီရင့် + လိမ္မော်ရောင် */
        .thai-icon:active {
            background: linear-gradient(135deg, #d32f2f, #ffab00);
            color: #fff;
            transform: translateX(-50%) scale(0.8);
            box-shadow: 0 0 25px #ffd700;
        }
        
        /* နှိပ်လိုက်တဲ့အခါ စာသားအရောင် အနီရောင် ပြောင်းသွားမည် */
        .thai-icon:active span {
            color: #ffd700; /* နှိပ်လိုက်ရင် စာသားက ရွှေရောင် ဖြစ်သွားမယ် */
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.9);
        }

        @keyframes pulse {
            0% { 
                box-shadow: 0 0 10px rgba(255, 193, 7, 0.6), 0 0 20px rgba(255, 82, 82, 0.4); 
                border-color: #ffd700;
            }
            100% { 
                box-shadow: 0 0 20px rgba(255, 193, 7, 1), 0 0 40px rgba(255, 82, 82, 0.8); 
                border-color: #fff;
            }
        }
    </style>
</head>
<body>
    <!-- အပေါ်ဆုံး ခေါင်းစီးဘား (ခရမ်းပြာရောင်) -->
    <div class="header-bar">
        <div class="title">Dubai 2D</div>
        <div class="new-badge">NEW</div>
    </div>

    <!-- SET နဲ့ VALUE စာသား -->
    <div class="sub-header">
        <span>SET</span>
        <span>VALUE</span>
    </div>

    <!-- Website ပြသည့်နေရာ -->
    <div class="zoom-box">
        <iframe src="https://dubai2dnew.netlify.app/" allowfullscreen scrolling="no"></iframe>
    </div>
    
    <!-- အပေါ်ပိုင်း ဖုံးအုပ်ရန် (အဖြူရောင်) -->
    <div class="top-overlay"></div>

    <!-- အောက်ပိုင်း (အဖြူရောင် အောက်ခံ) -->
    <div class="bottom-bg"></div>

    <!-- Thailand 2D ခလုတ် -->
    <a href="https://www.thaistock2d.com/" class="thai-icon">
        🇹🇭 <span>Thailand 2D</span>
    </a>

</body>
    </html>
