<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubai 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #fff; position: fixed; }

        .zoom-box { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; }
        .zoom-box iframe {
            position: absolute; top: 0; left: 0; width: 133.33%; height: 133.33%;
            border: none; transform: scale(0.75); transform-origin: top left;
        }

        .cover { position: fixed; bottom: 0; left: 0; width: 100%; height: 18%; background: #fff; z-index: 9999; }

        /* ရွှေရောင်နဲ့ မီးလက်နေတဲ့ ခလုတ်ဒီဇိုင်း */
        .thai-icon {
            position: fixed; 
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            /* အနီရောင်နဲ့ ရွှေရောင် အရောအနှော */
            background: linear-gradient(135deg, #d32f2f, #ff5252, #ffab00);
            color: #fff; 
            padding: 12px 24px; 
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.8), 0 0 30px rgba(255, 82, 82, 0.6);
            cursor: pointer; text-decoration: none;
            font-family: Arial, sans-serif; font-weight: bold; font-size: 15px;
            transition: all 0.3s ease-in-out; 
            border: 2px solid #ffd700; /* ရွှေရောင်ဘောင် */
            animation: pulse 1.5s infinite alternate; /* မီးလက်နေတဲ့ ပုံစံ */
            white-space: nowrap;
        }

        /* စာသားကို ရွှေရောင်ပေးထားတယ် */
        .thai-icon span {
            color: #ffd700; 
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.8);
            margin-left: 8px;
        }

        /* နှိပ်လိုက်ရင် ရွှေရောင်အပြည့်ဖြစ်သွားစေရန် */
        .thai-icon:active {
            background: #ffd700;
            color: #d32f2f;
            transform: translateX(-50%) scale(0.95);
            box-shadow: 0 0 25px #ffd700;
        }
        .thai-icon:active span {
            color: #d32f2f;
            text-shadow: none;
        }

        /* မီးလက်နေတဲ့ Animation */
        @keyframes pulse {
            0% { 
                box-shadow: 0 0 10px rgba(255, 193, 7, 0.6), 0 0 20px rgba(255, 82, 82, 0.4); 
                border-color: #ffd700;
            }
            100% { 
                box-shadow: 0 0 20px rgba(255, 193, 7, 1), 0 0 40px rgba(255, 82, 82, 0.8); 
                border-color: #fff;
            }
        }
    </style>
</head>
<body>
    <div class="zoom-box">
        <iframe src="https://dubai2dnew.netlify.app/" allowfullscreen scrolling="no"></iframe>
    </div>
    
    <!-- အောက်အလယ် ရွှေရောင်မီးလက်နေတဲ့ ခလုတ် -->
    <a href="https://www.thaistock2d.com/" class="thai-icon">
        🇹🇭 <span>Thailand 2D</span>
    </a>

    <div class="cover"></div>
</body>
</html>
