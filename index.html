<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubai 3D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #fff; position: fixed; }

        .zoom-box { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; }
        .zoom-box iframe {
            position: absolute; top: 0; left: 0; width: 133.33%; height: 133.33%;
            border: none; transform: scale(0.75); transform-origin: top left;
        }

        .cover { position: fixed; bottom: 0; left: 0; width: 100%; height: 18%; background: #fff; z-index: 9999; }

        .thai-icon {
            position: fixed; top: 15px; right: 15px; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff; padding: 8px 12px; border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer; text-decoration: none;
            font-family: Arial, sans-serif; font-weight: bold; font-size: 13px;
            border: 2px solid #fff; transition: 0.2s;
        }
        .thai-icon:active { transform: scale(0.95); }

        /* ပထမစာမျက်နှာ ပြန်လည်ရောက်ရှိစေရန် ခလုတ် */
        .back-btn {
            display: none;
            position: fixed; top: 15px; left: 15px; z-index: 10000;
            background: #2f3542; color: #fff; padding: 8px 15px;
            border-radius: 20px; font-family: Arial, sans-serif;
            font-size: 13px; cursor: pointer; border: none; font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ပထမစာမျက်နှာ (Dubai 3D) -->
    <div id="page1" class="zoom-box">
        <iframe src="https://dubai2dnew.netlify.app/" allowfullscreen scrolling="no"></iframe>
    </div>

    <!-- ဒုတိယစာမျက်နှာ (ThaiStock 2D) - ပုံစံ ၂ အတိုင်း -->
    <div id="page2" class="zoom-box" style="display: none;">
        <iframe src="https://www.thaistock2d.com/" allowfullscreen scrolling="no" style="transform: scale(1); width: 100%; height: 100%;"></iframe>
    </div>
    
    <!-- ညာဘက်အပေါ်ထောင့် ခလုတ် -->
    <button id="thaiBtn" class="thai-icon">🇹🇭 Thailand 2D</button>
    <button id="backBtn" class="back-btn">⬅ နောက်သို့</button>

    <div class="cover"></div>

    <script>
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const thaiBtn = document.getElementById('thaiBtn');
        const backBtn = document.getElementById('backBtn');

        // Thailand 2D နှိပ်လိုက်ရင် ဒုတိယစာမျက်နှာကို ပြမယ်
        thaiBtn.addEventListener('click', function() {
            page1.style.display = 'none';
            page2.style.display = 'block';
            thaiBtn.style.display = 'none';  // ခလုတ်ဖျောက်
            backBtn.style.display = 'block'; // Back ခလုတ်ပြ
        });

        // Back နှိပ်လိုက်ရင် ပထမစာမျက်နှာကို ပြန်ပြမယ်
        backBtn.addEventListener('click', function() {
            page1.style.display = 'block';
            page2.style.display = 'none';
            thaiBtn.style.display = 'flex';  // ခလုတ်ပြန်
            backBtn.style.display = 'none';  // Back ခလုတ်ဖျောက်
        });
    </script>

</body>
</html>
