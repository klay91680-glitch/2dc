<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dubai 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
            position: fixed;
        }

        .zoom-box {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .zoom-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 133.33%;
            height: 133.33%;
            border: none;
            transform: scale(0.75);
            transform-origin: top left;
        }

        /* အောက်ဆုံး ကြော်ငြာ လုံးဝဖုံးရန် */
        .cover {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 18%;          /* 12% → 18% တိုး */
            background: #fff;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="zoom-box">
        <iframe 
            src="https://dubai2dnew.netlify.app/" 
            allowfullscreen
            scrolling="no">
        </iframe>
    </div>
    <div class="cover"></div>
</body>
</html>
